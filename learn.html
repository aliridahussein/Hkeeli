<!DOCTYPE html>

<main id="main">
  <header class="page-head">

    <p data-i18n="learn.pageSubtitle"></p>

    <div class="wrap" id="units"></div>

    <div class="wrap" style="margin-block-start: var(--space-6);">
      <div class="tip-box">
        <h2 style="font-size:1.1rem; margin-block-end: var(--space-2);" data-i18n="learn.comingSoon"></h2>
        <p data-i18n="learn.comingSoonBody"></p>
      </div>
    </div>
  </section>

  <section class="games">
