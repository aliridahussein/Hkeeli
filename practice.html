<main id="main">
  <header class="page-head">
    <p class="eyebrow" style="justify-content:center;"><span class="dot"></span><span data-i18n="games.eyebrow">Practice</span></p>
    <h1 data-i18n="games.pageTitle">Practice</h1>
    <p data-i18n="games.pageSubtitle"></p>
  </header>

  <section style="padding-block-start: var(--space-4);">
    <div class="practice-layout">
      <!-- The recommended session. Built by js/practice.js from your progress. -->
      <div id="daily-card"></div>

      <!-- Scopes every game and the daily session to one unit; driven by ?unit= -->
      <div class="unit-filter" id="unit-filter"></div>

      <!-- Daily Practice or a single game mounts here -->
      <div id="game-host">
        <div class="game-loading"><p data-i18n="game.loading">Loading phrases…</p></div>
      </div>

      <!-- Secondary: the seven games, grouped by the skill they train -->
      <section class="game-catalogue" id="game-catalogue" aria-labelledby="catalogue-title">
        <h2 id="catalogue-title" data-i18n="practice.catalogueTitle">Choose a game</h2>
        <p class="catalogue-note" data-i18n="practice.catalogueBody"></p>
        <div id="game-groups"></div>
      </section>
    </div>
  </section>
</main>
